<!DOCTYPE html> 
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="dashboard">
        <div class="top">
            <p>Student Management System</p>
        </div>
        <div class="sidebar">
            <h2> Dashboard</h2>
            
                <div class="profile">
                    <img src="profile-pic.jpg" alt="profile photo">
                    <span>Name</span>
                </div>

                <li><a href="#"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#fff"><path d="M240-80q-33 0-56.5-23.5T160-160v-640q0-33 23.5-56.5T240-880h480q33 0 56.5 23.5T800-800v640q0 33-23.5 56.5T720-80H240Zm0-80h480v-640h-80v280l-100-60-100 60v-280H240v640Zm0 0v-640 640Zm200-360 100-60 100 60-100-60-100 60Z"/></svg>  Courses</a></li>
                <li><a href="#"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#fff"><path d="m305-704 112-145q12-16 28.5-23.5T480-880q18 0 34.5 7.5T543-849l112 145 170 57q26 8 41 29.5t15 47.5q0 12-3.5 24T866-523L756-367l4 164q1 35-23 59t-56 24q-2 0-22-3l-179-50-179 50q-5 2-11 2.5t-11 .5q-32 0-56-24t-23-59l4-165L95-523q-8-11-11.5-23T80-570q0-25 14.5-46.5T135-647l170-57Zm49 69-194 64 124 179-4 191 200-55 200 56-4-192 124-177-194-66-126-165-126 165Zm126 135Z"/></svg>  Grades</a></li>
                <li><a href="#"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#fff"><path d="M480-480q-66 0-113-47t-47-113q0-66 47-113t113-47q66 0 113 47t47 113q0 66-47 113t-113 47ZM160-160v-112q0-34 17.5-62.5T224-378q62-31 126-46.5T480-440q66 0 130 15.5T736-378q29 15 46.5 43.5T800-272v112H160Zm80-80h480v-32q0-11-5.5-20T700-306q-54-27-109-40.5T480-360q-56 0-111 13.5T260-306q-9 5-14.5 14t-5.5 20v32Zm240-320q33 0 56.5-23.5T560-640q0-33-23.5-56.5T480-720q-33 0-56.5 23.5T400-640q0 33 23.5 56.5T480-560Zm0-80Zm0 400Z"/></svg>  Profile</a></li>
                <li><a href="#"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#fff"><path d="m620-284 56-56q6-6 6-14t-6-14L540-505q4-11 6-22t2-25q0-57-40.5-97.5T410-690q-17 0-34 4.5T343-673l94 94-56 56-94-94q-8 16-12.5 33t-4.5 34q0 57 40.5 97.5T408-412q13 0 24.5-2t22.5-6l137 136q6 6 14 6t14-6ZM480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z"/></svg>  Settings</a></li>
        </div>
        <div class="right-half">
            <div class="main-content">
                <div class="search">
                    <input type="text" placeholder="  Search... ">
                    <button><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#fff"><path d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z"/></svg></button>
                    </div>
                    <div class="Logout">
                        <button onclick="window.location.href='../signin.html'">Logout</button>
                </div>
            </div>
            <div class="sem">
                <button>1st sem</button>
                <button>2nd sem</button>
                <button>3rd sem</button>
                <button>4th sem</button>
                <button>5th sem</button>
                <button>6th sem</button>
            </div>
            <div class="empty">
                <div class="charts-container" id="defaultCharts">
                    <div class="chart-box">
                        <h3>SGPA by Semester (Bar Chart)</h3>
                        <canvas id="sgpaChart"></canvas>
                    </div>
                    <div class="chart-box">
                        <h3>CGPA (Pie Chart)</h3>
                        <canvas id="cgpaChart"></canvas>
                    </div>
                </div>
                <div class="charts-container" id="semesterCharts" style="display: none;">
                    <div class="chart-box">
                        <h3 id="semesterTitle">1st Semester Subjects</h3>
                        <canvas id="subjectsChart"></canvas>
                    </div>
                    <div class="chart-box">
                        <h3>CGPA (Pie Chart)</h3>
                        <canvas id="cgpaChartSem"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <style>
        * {
            @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: poppins, sans-serif;
            --var:#9a8c98;
        }

        body {
            background: #fff;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .top {
            width: 100%;
            height: 68px;
            background: #9a8c98;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 24px;
            margin-bottom: 10px;
        }
        svg{
            vertical-align: middle;  
            margin-bottom:1px;
        }
        .dashboard {
            display: flex;
            flex-direction: column;
        }
        h2{
            padding:5px;
            border-radius: 5px;
        }
        .profile{
            margin:0 40px;
            margin-top:10px;
            margin-bottom: 20px;
        }
         img{
            width: 100px;
            height: 100px;
            background: #fff;
            border-radius: 50%; 
        }
        span{
            margin:0 20px;
            text-align: center;
                }
        li{
            display:block;
            list-style: none;
            background: transparent;
            border-radius: 6px;
            padding:10px 20px
        }
        li:hover{
            background: #8ecae6;
            border:solid 1px #1565c0;
        }
        a{ 
            text-decoration: none;
            color: #fff;
            font-weight: bold;
        }

        .sidebar {
            width: 230px;
            background: var(--var);
            color: #fff;
            margin-top: 11vh;
            border-radius: 0 20px 20px 0;
            height: 80vh;
            padding: 20px;
            position: fixed;
        }

        .right-half {
            margin-left: 220px;
            padding: 20px;
        }

        .main-content {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            width: 100%;
        }

        .search {
            display: flex;
            align-items: center;
            justify-content: center;
            width:30%;
        }

        .search input {
            width: 300px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .search button {
            padding: 5px 10px;
            margin-left: 5px;
            border: none;
            border-radius: 50px;
            background: var(--var);
            color: #fff;
            cursor: pointer;
        }
        .Logout{
            margin-left: 58%;
            width: 100%;
        }
        .Logout button {
            background: var(--var);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
        }

        .sem button {
            background: var(--var);
            color: #fff;
            border: none;
            padding: 10px 50px;
            margin-right: 10px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .sem button:hover {
            background: #8ecae6;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .sem button.active {
            background: #8ecae6;
            border: 2px solid #1565c0;
            box-shadow: 0 4px 12px rgba(21,101,192,0.3);
        }

        .empty {
            min-height: 300px;
            border: 2px dashed #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #777;
            border: solid 1px #ccc;
            font-size: 18px;
            margin-top: 20px;
            padding: 30px;
        }

        .charts-container {
            display: flex;
            gap: 40px;
            width: 100%;
            justify-content: space-around;
            flex-wrap: wrap;
        }

        .chart-box {
            flex: 1;
            min-width: 300px;
            max-width: 450px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .chart-box h3 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
            font-size: 16px;
        }

        .chart-box canvas {
            max-height: 250px;
        }
    </style>

    <script>
        // Sample data - Replace with actual data from Firebase
        const studentData = {
            cgpa: 7.5,
            semesterData: [
                { semester: '1st Sem', sgpa: 7.8 },
                { semester: '2nd Sem', sgpa: 7.5 },
                { semester: '3rd Sem', sgpa: 8.2 },
                { semester: '4th Sem', sgpa: 7.3 },
                { semester: '5th Sem', sgpa: 7.6 },
                { semester: '6th Sem', sgpa: 7.9 }
            ],
            subjectScores: {
                1: [
                    { subject: 'Mathematics', internal: 32, theory: 56, total: 88 },
                    { subject: 'Physics', internal: 30, theory: 54, total: 84 },
                    { subject: 'Chemistry', internal: 36, theory: 58, total: 94 },
                    { subject: 'English', internal: 28, theory: 50, total: 78 },
                    { subject: 'Computer Science', internal: 38, theory: 60, total: 98 },
                    { subject: 'Biology', internal: 34, theory: 55, total: 89 },
                    { subject: 'History', internal: 31, theory: 52, total: 83 },
                    { subject: 'Geography', internal: 33, theory: 57, total: 90 }
                ],
                2: [
                    { subject: 'Mathematics', internal: 35, theory: 58, total: 93 },
                    { subject: 'Physics', internal: 32, theory: 56, total: 88 },
                    { subject: 'Chemistry', internal: 33, theory: 54, total: 87 },
                    { subject: 'English', internal: 30, theory: 52, total: 82 },
                    { subject: 'Computer Science', internal: 36, theory: 59, total: 95 },
                    { subject: 'Biology', internal: 31, theory: 53, total: 84 },
                    { subject: 'History', internal: 34, theory: 56, total: 90 },
                    { subject: 'Geography', internal: 29, theory: 51, total: 80 }
                ],
                3: [
                    { subject: 'Mathematics', internal: 37, theory: 60, total: 97 },
                    { subject: 'Physics', internal: 35, theory: 58, total: 93 },
                    { subject: 'Chemistry', internal: 34, theory: 57, total: 91 },
                    { subject: 'English', internal: 32, theory: 54, total: 86 },
                    { subject: 'Computer Science', internal: 39, theory: 60, total: 99 },
                    { subject: 'Biology', internal: 36, theory: 58, total: 94 },
                    { subject: 'History', internal: 33, theory: 55, total: 88 },
                    { subject: 'Geography', internal: 35, theory: 59, total: 94 }
                ],
                4: [
                    { subject: 'Mathematics', internal: 28, theory: 52, total: 80 },
                    { subject: 'Physics', internal: 30, theory: 50, total: 80 },
                    { subject: 'Chemistry', internal: 29, theory: 51, total: 80 },
                    { subject: 'English', internal: 27, theory: 48, total: 75 },
                    { subject: 'Computer Science', internal: 34, theory: 56, total: 90 },
                    { subject: 'Biology', internal: 32, theory: 54, total: 86 },
                    { subject: 'History', internal: 31, theory: 52, total: 83 },
                    { subject: 'Geography', internal: 30, theory: 50, total: 80 }
                ],
                5: [
                    { subject: 'Mathematics', internal: 33, theory: 55, total: 88 },
                    { subject: 'Physics', internal: 31, theory: 52, total: 83 },
                    { subject: 'Chemistry', internal: 32, theory: 54, total: 86 },
                    { subject: 'English', internal: 29, theory: 50, total: 79 },
                    { subject: 'Computer Science', internal: 37, theory: 58, total: 95 },
                    { subject: 'Biology', internal: 35, theory: 56, total: 91 },
                    { subject: 'History', internal: 34, theory: 54, total: 88 },
                    { subject: 'Geography', internal: 32, theory: 53, total: 85 }
                ],
                6: [
                    { subject: 'Mathematics', internal: 36, theory: 59, total: 95 },
                    { subject: 'Physics', internal: 33, theory: 55, total: 88 },
                    { subject: 'Chemistry', internal: 35, theory: 57, total: 92 },
                    { subject: 'English', internal: 31, theory: 53, total: 84 },
                    { subject: 'Computer Science', internal: 38, theory: 60, total: 98 },
                    { subject: 'Biology', internal: 34, theory: 56, total: 90 },
                    { subject: 'History', internal: 36, theory: 58, total: 94 },
                    { subject: 'Geography', internal: 33, theory: 55, total: 88 }
                ]
            }
        };

        let sgpaChartInstance = null;
        let cgpaChartInstance = null;
        let subjectsChartInstance = null;
        let cgpaChartSemInstance = null;
        let currentSemester = null;

        // Initialize Bar Chart for SGPA
        function initSGPAChart() {
            const ctx = document.getElementById('sgpaChart').getContext('2d');
            if (sgpaChartInstance) sgpaChartInstance.destroy();
            sgpaChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: studentData.semesterData.map(s => s.semester),
                    datasets: [{
                        label: 'SGPA',
                        data: studentData.semesterData.map(s => s.sgpa),
                        backgroundColor: [
                            '#9a8c98',
                            '#8ecae6',
                            '#72ddf7',
                            '#90e0ef',
                            '#00b4d8',
                            '#0096c7'
                        ],
                        borderColor: '#555',
                        borderWidth: 1,
                        borderRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    animation: {
                        duration: 2000,
                        easing: 'easeInOutQuart',
                        delay: (context) => {
                            let delay = 0;
                            if (context.type === 'data' && context.mode === 'default') {
                                delay = context.dataIndex * 150 + context.datasetIndex * 100;
                            }
                            return delay;
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 10.0,
                            ticks: {
                                stepSize: 1.0
                            }
                        }
                    }
                }
            });
        }

        // Initialize Pie Chart for CGPA
        function initCGPAChart() {
            const ctx = document.getElementById('cgpaChart').getContext('2d');
            if (cgpaChartInstance) cgpaChartInstance.destroy();
            const cgpa = studentData.cgpa;
            const remaining = 10.0 - cgpa;
            
            cgpaChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['CGPA', 'Remaining'],
                    datasets: [{
                        data: [cgpa, remaining],
                        backgroundColor: ['#9a8c98', '#e0e0e0'],
                        borderColor: '#fff',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    animation: {
                        animateRotate: true,
                        animateScale: false,
                        duration: 2000,
                        easing: 'easeInOutQuart'
                    },
                    onClick: function(event) {
                        event.native.stopPropagation();
                        event.native.preventDefault();
                    },
                    plugins: {
                        legend: {
                            position: 'bottom'
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    if (context.label === 'CGPA') {
                                        return 'CGPA: ' + cgpa.toFixed(2) + ' / 10.0';
                                    }
                                    return context.label;
                                }
                            }
                        }
                    }
                }
            });
        }

        // Initialize Subject Scores Chart for selected semester
        function initSubjectsChart(semesterNumber) {
            const ctx = document.getElementById('subjectsChart').getContext('2d');
            if (subjectsChartInstance) subjectsChartInstance.destroy();
            
            const subjects = studentData.subjectScores[semesterNumber];
            
            subjectsChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: subjects.map(s => s.subject),
                    datasets: [
                        {
                            label: 'Internal (40)',
                            data: subjects.map(s => s.internal),
                            backgroundColor: '#8ecae6',
                            borderColor: '#555',
                            borderWidth: 1,
                            borderRadius: 3
                        },
                        {
                            label: 'Theory (60)',
                            data: subjects.map(s => s.theory),
                            backgroundColor: '#00b4d8',
                            borderColor: '#555',
                            borderWidth: 1,
                            borderRadius: 3
                        },
                        {
                            label: 'Total (100)',
                            data: subjects.map(s => s.total),
                            backgroundColor: '#9a8c98',
                            borderColor: '#555',
                            borderWidth: 1,
                            borderRadius: 3
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    animation: {
                        duration: 1500,
                        easing: 'easeInOutQuart'
                    },
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top'
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100.0,
                            ticks: {
                                stepSize: 10.0
                            }
                        }
                    }
                }
            });
        }

        // Initialize CGPA Chart for semester view
        function initCGPAChartSem() {
            const ctx = document.getElementById('cgpaChartSem').getContext('2d');
            if (cgpaChartSemInstance) cgpaChartSemInstance.destroy();
            
            const subjects = studentData.subjectScores[currentSemester];
            const totalMarks = subjects.reduce((sum, s) => sum + s.total, 0);
            const averageMarks = totalMarks / subjects.length;
            const remaining = 100 - averageMarks;
            
            cgpaChartSemInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Average Score', 'Remaining'],
                    datasets: [{
                        data: [averageMarks.toFixed(2), remaining.toFixed(2)],
                        backgroundColor: ['#9a8c98', '#e0e0e0'],
                        borderColor: '#fff',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    animation: {
                        animateRotate: true,
                        animateScale: false,
                        duration: 1500,
                        easing: 'easeInOutQuart'
                    },
                    onClick: function(event) {
                        event.native.stopPropagation();
                        event.native.preventDefault();
                    },
                    plugins: {
                        legend: {
                            position: 'bottom'
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    if (context.label === 'Average Score') {
                                        return 'Average: ' + averageMarks.toFixed(2) + ' / 100';
                                    }
                                    return context.label;
                                }
                            }
                        }
                    }
                }
            });
        }

        // Initialize charts when page loads
        document.addEventListener('DOMContentLoaded', function() {
            initSGPAChart();
            initCGPAChart();
            
            // Prevent default behavior on chart canvas clicks
            const sgpaCanvas = document.getElementById('sgpaChart');
            const cgpaCanvas = document.getElementById('cgpaChart');
            
            sgpaCanvas.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
            });
            
            cgpaCanvas.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
            });

            // Add event listeners to semester buttons
            const semButtons = document.querySelectorAll('.sem button');
            semButtons.forEach((button, index) => {
                button.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    
                    // Remove active class from all buttons
                    semButtons.forEach(btn => btn.classList.remove('active'));
                    // Add active class to clicked button
                    button.classList.add('active');
                    
                    const semesterNumber = index + 1;
                    currentSemester = semesterNumber;
                    
                    // Hide default charts and show semester charts
                    document.getElementById('defaultCharts').style.display = 'none';
                    document.getElementById('semesterCharts').style.display = 'flex';
                    
                    // Update semester title
                    const semNames = ['1st', '2nd', '3rd', '4th', '5th', '6th'];
                    document.getElementById('semesterTitle').textContent = semNames[index] + ' Semester Subjects';
                    
                    // Initialize charts for selected semester
                    initSubjectsChart(semesterNumber);
                    initCGPAChartSem();
                });
            });
        });
    </script>
</body>

</html>
