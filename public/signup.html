<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
</head>
<body>
    <div class="top">
            <p>Student Management System</p>
        </div>
    <div class="index">
            <div class="signup">
                <h2>Sign Up</h2>
                <form>
                <input type="text" id="name" name="name" placeholder="Name" >
                <br>
                <input type="email" id="email" name="email" placeholder="Email" >
                <input type="password" id="password" name="password" placeholder="Password" >
                <button type="submit">SignUp</button>
                <p>create new account <a href="signin.html">SignIn</a></p>
                </form>
            </div>
        </div>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: poppins, sans-serif;
        }
        body{
            background:#90e0ef;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .top{
            width: 100%;
            height: 70px;
            background: #219ebc;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 24px;
            margin:10px 0 ;
        }
        .index{
            width: 100%;
            display: flex;
            justify-content: center;
        }
         .right-half{
            margin:auto;
            display: flex;
            flex-direction: column;
            color: #fff;  
        }
        h2{
            
            margin-bottom: 20px;
            color:#219ebc;
            font-size: 30px;
            text-align: center;
        }
        .signup{
            margin-top: 30px;
            max-width: 25%;
            background: #fff;
            display: block;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: solid 1px #ccc;
            border-radius: 8px;
            padding: 20px;
        }
        .role-btn.active{
            background: #219ebc;
            color:#fff;
        }
         .role-btn{
            background: #fff;
            margin: 10px 0;
            width: 48%;
            color: #219ebc;
            border: solid 1px #219ebc;
            cursor: pointer;
            font-size: 16px;
        }
       
        input,button{
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button{
            background: #219ebc;
            color: #fff;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        .signup p{
            margin-top: 10px;
            font-size: 14px;
            color: #555;
        }
        .signup p{
            margin-top: 10px;
            font-size: 14px;
            color: #555;
        }
        a{
            text-decoration: none;
            color: #219ebc;
        }
    </style>
    <script>
        const buttons = document.querySelectorAll('.role-btn');
        buttons.forEach(button => {
            button.addEventListener('click', (e) => {
                e.preventDefault();
                buttons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
                const placeholderText = button.textContent.trim() === 'Student' ? 'Student ID' : 'Admin ID';
                const input = document.getElementById('student-id');
                if(input) input.placeholder = placeholderText;
            });
        });
       
    </script>
</body>
</html>
